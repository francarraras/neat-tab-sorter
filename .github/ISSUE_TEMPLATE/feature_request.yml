name: Feature request
description: Suggest an idea for Neat Tab Sorter.
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: Neat Tab Sorter aims to stay small and fast. It sorts tabs (it doesn't close or manage them), and everything stays on your computer.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I ..., I have to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
