name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      # Download it from the run's summary, unzip, and use "Load unpacked" to try the change.
      - name: Upload a ready-to-load build
        uses: actions/upload-artifact@v7
        with:
          name: neat-tab-sorter-build
          path: src/
